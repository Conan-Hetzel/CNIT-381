---
- name: BACK UP ALL DEVICES
  hosts: cml
  gather_facts: no
  tasks:
    - name: Back up the running config
      cisco.ios.ios_config:
        # TODO: turn on backup
        backup: yes
        # TODO: backup_options -> dir_path: ./backups
        backup_options:
          dir_path: ./backups
          # filename: {{ inventory_hostname }}.cfg
          filename: "{{ inventory_hostname }}.cfg"
